<div id="change-password-screen" class="min-h-screen flex items-center justify-center p-4" style="background: linear-gradient(135deg, rgb(15, 23, 42) 0%, rgb(30, 27, 75) 40%, rgb(49, 46, 129) 70%, rgb(30, 27, 75) 100%);">
  <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <div class="absolute -top-40 -right-40 w-96 h-96 bg-indigo-600/10 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-40 -left-40 w-96 h-96 bg-blue-600/10 rounded-full blur-3xl"></div>
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-indigo-900/20 rounded-full blur-3xl"></div>
  </div>

  <div class="relative w-full max-w-sm">
    <div class="bg-slate-900/90 backdrop-blur-xl rounded-3xl shadow-2xl border border-white/10 overflow-hidden">
      <div class="h-1 bg-gradient-to-l from-rose-400 via-orange-500 to-amber-400"></div>

      <div class="p-8">
        <div class="flex flex-col items-center mb-8">
          <div class="w-16 h-16 rounded-2xl flex items-center justify-center mb-4 shadow-xl" style="background:linear-gradient(135deg,#f43f5e,#f97316)">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" appIcon="key"></svg>
          </div>
          <h1 class="text-xl font-black text-white text-center leading-tight">
            {{ isMandatory ? 'تغییر رمز عبور اجباری' : 'تغییر رمز عبور' }}
          </h1>
          <p class="text-xs text-slate-400 mt-1.5 text-center">
            {{ isMandatory ? 'برای ادامه کار باید رمز عبور پیش‌فرض خود را تغییر دهید' : 'لطفاً رمز عبور جدید خود را وارد کنید' }}
          </p>
        </div>

        <div *ngIf="errorMessage" class="mb-4 p-3 rounded-xl text-xs flex items-center gap-2.5" style="background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);color:#fca5a5">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" appIcon="alert-circle"></svg>
          <span>{{ errorMessage }}</span>
        </div>

        <div class="space-y-4">
          <div>
            <label for="cp-old-password" class="block text-xs font-semibold text-slate-300 mb-1.5">رمز عبور فعلی</label>
            <div class="relative">
              <input [type]="oldPasswordFieldType" [(ngModel)]="oldPassword" id="cp-old-password" placeholder="••••••••" class="w-full pr-4 pl-10 py-2.5 rounded-xl text-sm bg-slate-800 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500/30 transition-all">
              <button
                type="button"
                (click)="toggleOldPassword()"
                [title]="oldPasswordFieldType === 'password' ? 'نمایش رمز عبور' : 'پنهان کردن رمز عبور'"
                [attr.aria-label]="oldPasswordFieldType === 'password' ? 'نمایش رمز عبور' : 'پنهان کردن رمز عبور'"
                class="absolute inset-y-0 left-0 flex items-center justify-center w-10 h-10 my-auto rounded-lg cursor-pointer text-slate-400 hover:text-white transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-orange-500 z-10"
              >
                <svg *ngIf="oldPasswordFieldType === 'password'" class="pointer-events-none" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" appIcon="action-view"></svg>
                <svg *ngIf="oldPasswordFieldType === 'text'" class="pointer-events-none" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" appIcon="action-hide"></svg>
              </button>
            </div>
          </div>

          <div>
            <label for="cp-new-password" class="block text-xs font-semibold text-slate-300 mb-1.5">رمز عبور جدید</label>
            <div class="relative">
              <input [type]="newPasswordFieldType" [(ngModel)]="newPassword" id="cp-new-password" placeholder="••••••••" class="w-full pr-4 pl-10 py-2.5 rounded-xl text-sm bg-slate-800 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500/30 transition-all">
              <button
                type="button"
                (click)="toggleNewPassword()"
                [title]="newPasswordFieldType === 'password' ? 'نمایش رمز عبور' : 'پنهان کردن رمز عبور'"
                [attr.aria-label]="newPasswordFieldType === 'password' ? 'نمایش رمز عبور' : 'پنهان کردن رمز عبور'"
                class="absolute inset-y-0 left-0 flex items-center justify-center w-10 h-10 my-auto rounded-lg cursor-pointer text-slate-400 hover:text-white transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-orange-500 z-10"
              >
                <svg *ngIf="newPasswordFieldType === 'password'" class="pointer-events-none" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" appIcon="action-view"></svg>
                <svg *ngIf="newPasswordFieldType === 'text'" class="pointer-events-none" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" appIcon="action-hide"></svg>
              </button>
            </div>
          </div>

          <div>
            <label for="cp-confirm-password" class="block text-xs font-semibold text-slate-300 mb-1.5">تکرار رمز عبور جدید</label>
            <div class="relative">
              <input [type]="confirmPasswordFieldType" [(ngModel)]="confirmPassword" id="cp-confirm-password" placeholder="••••••••" class="w-full pr-4 pl-10 py-2.5 rounded-xl text-sm bg-slate-800 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500/30 transition-all">
              <button
                type="button"
                (click)="toggleConfirmPassword()"
                [title]="confirmPasswordFieldType === 'password' ? 'نمایش رمز عبور' : 'پنهان کردن رمز عبور'"
                [attr.aria-label]="confirmPasswordFieldType === 'password' ? 'نمایش رمز عبور' : 'پنهان کردن رمز عبور'"
                class="absolute inset-y-0 left-0 flex items-center justify-center w-10 h-10 my-auto rounded-lg cursor-pointer text-slate-400 hover:text-white transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-orange-500 z-10"
              >
                <svg *ngIf="confirmPasswordFieldType === 'password'" class="pointer-events-none" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" appIcon="action-view"></svg>
                <svg *ngIf="confirmPasswordFieldType === 'text'" class="pointer-events-none" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" appIcon="action-hide"></svg>
              </button>
            </div>
          </div>

          <button
            type="button"
            [disabled]="isSubmitting"
            (click)="handleChangePassword()"
            class="w-full min-h-[48px] py-3 rounded-xl text-sm font-bold text-white transition-all active:scale-[.98] mt-4 flex items-center justify-center gap-2 cursor-pointer disabled:cursor-not-allowed"
            style="background:linear-gradient(135deg,#f43f5e,#f97316);box-shadow:0 8px 25px rgba(249,115,22,.4)"
            [style.opacity]="isSubmitting ? '0.85' : '1'"
          >
            <span *ngIf="!isSubmitting">تایید و تغییر رمز</span>
            <span *ngIf="isSubmitting">در حال پردازش...</span>
            <svg *ngIf="!isSubmitting" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" appIcon="chevron-left"></svg>
            <svg *ngIf="isSubmitting" class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" appIcon="action-loading"></svg>
          </button>

          <button *ngIf="isMandatory" [disabled]="isSubmitting" (click)="logout()" class="w-full min-h-[40px] py-2.5 mt-2 rounded-xl text-xs font-semibold text-slate-400 hover:text-white hover:bg-slate-800 transition-all flex items-center justify-center cursor-pointer">
            خروج از حساب کاربری
          </button>
          <button *ngIf="!isMandatory" [disabled]="isSubmitting" (click)="goBack()" class="w-full min-h-[40px] py-2.5 mt-2 rounded-xl text-xs font-semibold text-slate-400 hover:text-white hover:bg-slate-800 transition-all flex items-center justify-center cursor-pointer">
            انصراف و بازگشت به داشبورد
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
