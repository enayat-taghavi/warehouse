<div class="min-h-screen bg-slate-50/50 p-3 md:p-6 space-y-4" dir="rtl" [class.contents]="embedded">
  @if (!embedded) {

  <!-- ── ۱. هدر یکپارچه و چسبان مرکز فرماندهی (Unified Sticky Command Center Header) ── -->
  <app-command-center rowFrom="lg">
    <!-- سمت راست: دراپ‌داون انتخاب بخش و تب‌های فیلتر وضعیت -->
    <div cc-tabs class="flex flex-wrap items-center gap-2 md:gap-3">
      <!-- انتخابگر بخش فعال (Guardian G1: Section Isolation) -->
      <div *ngIf="mySections.length > 0" class="flex items-center gap-1.5 bg-slate-50 border border-slate-200 px-2.5 py-1 rounded-xl">
        <label for="sup-inv-section" class="text-[11px] font-bold text-slate-500">بخش:</label>
        <select
          id="sup-inv-section"
          [(ngModel)]="selectedSectionId"
          (change)="onSectionChanged()"
          class="bg-transparent text-xs font-black text-emerald-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 rounded cursor-pointer">
          <option [ngValue]="null">همه بخش‌ها</option>
          <option *ngFor="let sec of mySections" [ngValue]="sec.id">
            {{ sec.project_name ? (sec.project_name + ' ◀ ') : '' }}{{ sec.name }}
          </option>
        </select>
      </div>

      <!-- تب‌های فرعی در کپسول محصور (Subtabs Navigation) -->
      <app-tab-bar
        [tabs]="tabs"
        [active]="activeSubTab"
        (activeChange)="switchSubTab($event)"
        mobile="short"
        fullLabelFrom="lg"
      />
    </div>

    <!-- سمت چپ: دکمه‌های اکشن ۳گانه استاندارد -->
    <div cc-actions class="flex items-center gap-2 justify-end">
      <button
        type="button"
        appAction="export-excel"
        label="خروجی گزارش رسیدهای پرداخت"
        (click)="exportExcel()"
      ></button>

      <button
        type="button"
        appAction="refresh"
        label="تازه‌سازی رسیدهای پرداخت"
        [busy]="isLoading"
        (click)="fetchInvoices()"
      ></button>
    </div>
  </app-command-center>

  <!-- ── ۲. جدول و کارت داده‌ها (Data Card Container) ── -->
  <div class="bg-white rounded-3xl border border-slate-200/80 shadow-sm overflow-hidden">
    <!-- نوار بالای جدول: جستجو (onSearch به جای syncUrlParams) -->
    <div class="p-3 md:p-4 border-b border-slate-100 flex flex-wrap items-center justify-between gap-3 bg-slate-50/50">
      <div class="relative flex-1 min-w-[240px] max-w-md">
        <input
          type="text"
          [(ngModel)]="searchQuery"
          (keyup.enter)="onSearch()"
          placeholder="جستجو بر اساس شماره رسید پرداخت، طرف‌حساب یا شرح هزینه..."
          class="w-full pr-9 pl-8 py-2 bg-white border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all font-sans" />
        <span class="absolute right-3 top-2.5 text-slate-400 text-xs">🔍</span>
        <button
          *ngIf="searchQuery"
          (click)="clearSearch()"
          class="absolute left-2.5 top-2 text-slate-400 hover:text-slate-600 text-sm cursor-pointer"
          title="پاک‌سازی جستجو">
          ✕
        </button>
      </div>

      <div class="flex items-center gap-2 text-xs text-slate-500 font-bold">
        <span>بخش:</span>
        <span class="text-indigo-700 font-mono">{{ selectedSection?.name || 'تمامی بخش‌ها' }}</span>
      </div>
    </div>

    <!-- بدنه جدول / وضعیت لودینگ و خالی -->
    <div *ngIf="isLoading" class="p-12 text-center space-y-3">
      <div class="w-8 h-8 border-2 border-indigo-600 border-t-transparent rounded-full animate-spin mx-auto"></div>
      <p class="text-xs text-slate-500 font-bold">در حال بارگذاری رسیدهای پرداخت هزینه...</p>
    </div>

    <div *ngIf="!isLoading && items.length === 0" class="p-12 text-center space-y-3">
      <div class="w-16 h-16 rounded-2xl bg-indigo-50 text-indigo-600 flex items-center justify-center mx-auto text-2xl shadow-inner">
        🧾
      </div>
      <h3 class="text-sm font-black text-slate-800">هیچ رسید پرداخت هزینه‌ای یافت نشد</h3>
      <p class="text-xs text-slate-500 max-w-md mx-auto">
        رسید پرداخت جدیدی جهت بررسی سرپرست کارگاه موجود نیست.
      </p>
    </div>

    @if (!isLoading && items.length > 0) {
      <app-payment-receipt-list [rows]="items" [sharingId]="sharingId" (preview)="openPreview($event, 'preview')" (share)="shareInvoice($event)" (print)="printInvoice($event)">
        <ng-template #rowActions let-item>
          @if (item.status === 'pending_supervisor') {
            <button type="button" appAction="approve" size="sm" display="label" (click)="approveSingle(item)"></button>
            <button type="button" appAction="reject" size="sm" label="عودت" display="label" (click)="rejectSingle(item)"></button>
          }
        </ng-template>
      </app-payment-receipt-list>
    }
  </div>

  }

  <!-- دیالوگ ثبت علت عودت فاکتور -->
  <app-workflow-reason-dialog
    [open]="isReasonDialogOpen"
    [title]="reasonDialogTitle"
    [confirmLabel]="reasonDialogConfirmLabel"
    [serverError]="reasonDialogServerError"
    (confirmed)="onReasonConfirmed($event)"
    (cancelled)="onReasonCancelled()"
  ></app-workflow-reason-dialog>

  <!-- مودال پیش‌نمایش و سابقه فاکتور -->
  <app-invoice-preview-modal
    [isOpen]="previewModalOpen"
    [invoiceId]="previewInvoiceId"
    [invoice]="previewInvoiceItem"
    [initialTab]="previewInitialTab"
    (closed)="closePreview()"
  ></app-invoice-preview-modal>

</div>
