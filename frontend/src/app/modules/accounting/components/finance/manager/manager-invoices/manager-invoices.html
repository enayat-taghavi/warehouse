<div class="p-3 md:p-6 space-y-4" dir="rtl" [class.contents]="embedded">
  @if (!embedded) {
  <div class="bg-white rounded-3xl border border-slate-200/80 shadow-sm overflow-hidden">
    <div class="p-4 border-b border-slate-100 flex items-center justify-between">
      <h3 class="text-sm font-black text-slate-800 flex items-center gap-2">
        <svg [appIcon]="invoiceIcon" class="w-4 h-4 text-indigo-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"></svg>
        <span>دستورهای پرداخت هزینه و اسناد خرید نیازمند مجوز پرداخت مدیریت</span>
      </h3>
      <button type="button" appAction="refresh" [busy]="isLoading" (click)="loadInvoices()"></button>
    </div>

    @if (isLoading && invoicesList.length === 0) {
      <p class="p-10 text-center text-slate-400 text-xs" role="status">در حال بارگذاری دستورهای پرداخت...</p>
    } @else if (invoicesList.length === 0) {
      <p class="p-8 text-center text-slate-400 font-medium">هیچ دستور پرداختی در انتظار تصویب مدیر نمی‌باشد.</p>
    } @else {
      <app-payment-receipt-list [rows]="invoicesList" (preview)="openPreview($event, 'preview')">
        <ng-template #rowActions let-inv>
          <button type="button" appAction="approve" display="label" label="مجوز پرداخت" size="sm" (click)="approveInvoiceManager(inv)"></button>
          <button type="button" appAction="return" display="label" label="بازنگری" size="sm" (click)="rejectInvoiceManager(inv)"></button>
        </ng-template>
      </app-payment-receipt-list>
    }
  </div>

  }

  <!-- دلیل بازنگری فاکتور -->
  <app-workflow-reason-dialog
    [open]="isInvoiceReasonOpen"
    [title]="invoiceReasonTitle"
    confirmLabel="بازگرداندن برای بازنگری"
    [serverError]="invoiceReasonServerError"
    (confirmed)="onInvoiceReasonConfirmed($event)"
    (cancelled)="onInvoiceReasonCancelled()"
  ></app-workflow-reason-dialog>

  <!-- مودال پیش‌نمایش و سابقه فاکتور -->
  <app-invoice-preview-modal
    [isOpen]="previewModalOpen"
    [invoiceId]="previewInvoiceId"
    [invoice]="previewInvoiceItem"
    [initialTab]="previewInitialTab"
    (closed)="closePreview()"
  ></app-invoice-preview-modal>
</div>
