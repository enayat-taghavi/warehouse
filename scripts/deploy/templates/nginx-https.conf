# Default catch-all servers for unauthorized host / direct IP scanning
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    server_tokens off;
    ssl_reject_handshake on;
    return 444;
}

# HTTP -> HTTPS redirect and ACME challenge renewal
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Upstream Daphne ASGI backend
upstream warehouse_daphne {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 50M;
    client_body_timeout 60s;
    client_header_timeout 60s;

    # Global Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Maintenance Mode (503 Service Unavailable, exempting localhost healthcheck)
    set $maintenance 0;
    if (-f /var/www/warehouse/shared/MAINTENANCE) {
        set $maintenance 1;
    }
    if ($remote_addr ~ "^(127\.0\.0\.1|::1)$") {
        set $maintenance 0;
    }
    if ($maintenance = 1) {
        return 503;
    }
    error_page 503 @maintenance;
    location @maintenance {
        add_header Retry-After 60 always;
        add_header Content-Type "text/plain; charset=utf-8" always;
        return 503 "Warehouse System Maintenance in progress. Please retry in 60 seconds.\n";
    }

    root /var/www/warehouse/current/warehouse-front/dist/warehouse-app/browser;

    # ACME challenge renewal
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        allow all;
    }

    # Static Files (release-isolated)
    location ^~ /static/ {
        alias /var/www/warehouse/current/warehouse-backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # Media Files: Proxied to Django for HMAC signature verification
    location ^~ /media/ {
        proxy_pass http://warehouse_daphne;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_buffering off;
    }

    # Internal Media Location for X-Accel-Redirect (Direct high-performance sendfile via Nginx)
    # location /internal_media/
    location ^~ /internal_media/ {
        internal;
        alias /var/www/warehouse/shared/media/;
        sendfile on;
        tcp_nopush on;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # WebSocket Real-Time Channel Connections
    location ^~ /ws/ {
        proxy_pass http://warehouse_daphne;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Django REST Framework API Endpoints
    location ^~ /api/ {
        proxy_pass http://warehouse_daphne;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Django Administration Panel
    location ^~ /admin/ {
        proxy_pass http://warehouse_daphne;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Frontend Service Worker and critical metadata: Strictly NO-CACHE
    location ~* ^/(index\.html|ngsw\.json|manifest\.webmanifest|ngsw-worker\.js|safety-worker\.js)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    # Hashed JS and CSS chunks: 1-Year Immutable Caching (esbuild pattern)
    location ~* "-[A-Za-z0-9]{8}\.(js|css)$" {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Extension Assets (Fonts, Icons, Images): 1-Day Cache, Return 404 if missing (Never fallback to index.html)
    location ~* \.(ico|png|jpg|jpeg|webp|svg|gif|woff|woff2|ttf|eot)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
        try_files $uri =404;
    }

    # SPA Client Routing Fallback (Only for extensionless routes)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
}
