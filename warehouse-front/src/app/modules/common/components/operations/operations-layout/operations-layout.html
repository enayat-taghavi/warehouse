<div dir="rtl" class="h-screen h-[100dvh] bg-slate-50 text-slate-800 flex flex-row font-sans select-none relative overflow-hidden">

  <!-- سایدبار دسکتاپ تمام‌قد سمت راست (Unified Full-Height Sidebar مطابق استاندارد کل سیستم) -->
  <aside
    class="hidden lg:flex flex-col justify-between bg-slate-900 border-l border-slate-800 transition-all duration-300 shrink-0 h-full z-[50]"
    [ngClass]="isSidebarCollapsed() ? 'w-20' : 'w-64'"
  >
    <!-- سربرگ سایدبار مرکز عملیات (در بالاترین نقطه سمت راست صفحه) -->
    <div class="p-4 border-b border-slate-800 flex items-center gap-3 h-[70px] shrink-0">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-cyan-600 to-indigo-600 flex items-center justify-center text-white text-xl shadow-xs shrink-0">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-white" appIcon="shield"></svg>
      </div>
      <div *ngIf="!isSidebarCollapsed()" class="flex-1 min-w-0">
        <div class="flex items-center gap-1.5">
          <h2 class="font-black text-white text-xs truncate">مرکز عملیات و زیرساخت</h2>
          <span class="text-[9px] font-mono font-black px-1.5 py-0.5 rounded bg-cyan-950 text-cyan-300 border border-cyan-800 shrink-0">SOC/NOC</span>
        </div>
        <span class="text-[10px] text-slate-400 font-medium truncate block">اتاق فرماندهی پدافند و سرور</span>
      </div>
    </div>

    <!-- لیست منوها -->
    <div class="p-3 flex-1 flex flex-col gap-1.5 overflow-y-auto">
      <div class="px-3 py-2 text-[10px] font-black tracking-wider text-slate-400 uppercase">
        {{ isSidebarCollapsed() ? 'SOC' : 'ارکان مرکز عملیات' }}
      </div>

      <button
        *ngFor="let item of navItems"
        (click)="navigateTo(item.route)"
        class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-black transition-all cursor-pointer text-right group relative overflow-hidden"
        [ngClass]="activeRoute() === item.id
          ? 'bg-indigo-600 text-white shadow-xs'
          : 'text-slate-400 hover:text-white hover:bg-slate-800/80'"
        [title]="item.label"
      >
        <span class="shrink-0 group-hover:scale-105 transition-transform flex items-center justify-center">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" [appIcon]="item.icon"></svg>
        </span>
        <span *ngIf="!isSidebarCollapsed()" class="truncate flex-1">{{ item.label }}</span>
        <span *ngIf="!isSidebarCollapsed() && item.badge" class="px-1.5 py-0.5 rounded text-[9px] font-mono" [ngClass]="activeRoute() === item.id ? 'bg-indigo-700 text-white' : 'bg-slate-800 text-slate-300 border border-slate-700'">
          {{ item.badge }}
        </span>
      </button>
    </div>

    <!-- پاورقی سایدبار: سوئیچ سریع به ماژول‌های انبارداری و مالی -->
    <div class="p-3 border-t border-slate-800 flex flex-col gap-2 shrink-0">
      <div *ngIf="!isSidebarCollapsed() && hasAnyConnectedModule" class="bg-slate-950/60 rounded-xl p-2.5 border border-slate-800 flex flex-col gap-2">
        <div class="text-[11px] font-bold text-slate-400 flex items-center justify-between">
          <span>{{ hasMultipleConnectedModules ? 'سامانه‌های متصل:' : 'سامانه متصل:' }}</span>
          <span *ngIf="hasMultipleConnectedModules" class="text-[10px] text-indigo-400 font-mono">یکپارچه</span>
        </div>
        <div class="grid gap-1.5" [ngClass]="hasMultipleConnectedModules ? 'grid-cols-2' : 'grid-cols-1'">
          <button
            *ngIf="showWarehouseLink"
            (click)="goToWarehouse()"
            class="px-2 py-1.5 rounded-lg bg-slate-900 hover:bg-slate-800 border border-slate-800 text-[11px] font-bold text-indigo-300 transition-colors text-center cursor-pointer flex items-center justify-center gap-1.5"
          >
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" appIcon="package"></svg>
            <span>انبارداری</span>
          </button>
          <button
            *ngIf="showAccountingLink"
            (click)="goToFinance()"
            class="px-2 py-1.5 rounded-lg bg-slate-900 hover:bg-slate-800 border border-slate-800 text-[11px] font-bold text-emerald-300 transition-colors text-center cursor-pointer flex items-center justify-center gap-1.5"
          >
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" appIcon="credit-card"></svg>
            <span>مالی</span>
          </button>
        </div>
      </div>

      <button
        (click)="toggleSidebar()"
        class="w-full flex items-center justify-center p-2 rounded-xl bg-slate-800/60 hover:bg-slate-800 text-slate-400 hover:text-white transition-all text-xs cursor-pointer"
        [title]="isSidebarCollapsed() ? 'گسترش منو' : 'جمع کردن منو'"
      >
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" [class.rotate-180]="isSidebarCollapsed()" appIcon="chevron-left"></svg>
      </button>
    </div>
  </aside>

  <!-- ناحیه سمت چپ شامل هدر بالای صفحه و محتوای کارگاهی -->
  <div class="flex-1 flex flex-col min-w-0 min-h-0 bg-slate-50 relative overflow-hidden">

    <!-- نوار بالای صفحه با تم رسمی و اداری یکپارچه کل سیستم (Unified Enterprise Header) -->
    <header class="bg-white border-b border-slate-200 p-4 h-[70px] flex items-center justify-between shadow-xs relative z-[45] shrink-0 transition-all">

      <!-- Right Side (RTL Start): Mobile Toggle, Desktop Toggle, User Menu, Chat, Network Badge -->
      <div class="flex items-center gap-2 md:gap-4 flex-1 justify-start shrink-0">
        <!-- دکمه منوی همبرگر موبایل -->
        <button
          (click)="toggleMobileMenu()"
          class="lg:hidden p-2 min-w-[40px] min-h-[40px] flex items-center justify-center rounded-lg hover:bg-slate-50 text-slate-600 shrink-0 cursor-pointer tap-target"
          title="نمایش منو"
          aria-label="نمایش منو"
        >
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" appIcon="menu"></svg>
        </button>

        <!-- دکمه جمع / باز کردن سایدبار دسکتاپ -->
        <button
          (click)="toggleSidebar()"
          class="hidden lg:block p-2 rounded-lg hover:bg-slate-50 text-slate-600 shrink-0 transition-colors cursor-pointer"
          title="نمایش/مخفی کردن منو"
          aria-label="نمایش/مخفی کردن منو"
        >
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" appIcon="menu"></svg>
        </button>

        <!-- Unified Shared User Menu -->
        <app-user-menu theme="cyan"></app-user-menu>

        <!-- سوئیچر سریع شرکت کاری فعال -->
        <app-company-switcher class="shrink-0"></app-company-switcher>

        <!-- ─── پیام‌رسان سازمانی ─── -->
        <button
          *ngIf="commService.isChatEnabled()"
          (click)="toggleChatDrawer()"
          class="relative p-2 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300 transition-all active:scale-95 cursor-pointer shrink-0 tap-target"
          title="پیام‌رسان سازمانی"
          aria-label="پیام‌رسان سازمانی">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" appIcon="message-square"></svg>
          <span *ngIf="commService.totalUnreadCount() > 0"
                class="absolute -top-0.5 -right-0.5 min-w-[18px] h-[18px] text-white text-[9px] font-black rounded-full flex items-center justify-center px-1 border-2 border-white dark:border-slate-900 shadow-sm transition-all"
                [ngClass]="commService.hasNewIncomingPulse() ? 'animate-bounce bg-rose-600 ring-2 ring-rose-300' : 'animate-pulse bg-blue-600'">
            {{ commService.totalUnreadCount() }}
          </span>
        </button>

        <!-- Dynamic Unified Network, Queue & Sync Hub -->
        <app-offline-pending-badge mode="header" />
      </div>

      <!-- Center: Page Title (مخفی در موبایل برای باز شدن فضا) -->
      <div class="hidden md:flex flex-1 justify-center min-w-0 shrink-0 px-2">
        <div class="flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-cyan-500 animate-pulse shrink-0"></span>
          <h1 class="text-sm font-bold text-slate-800 truncate">{{ currentTitle() }}</h1>
        </div>
      </div>

      <!-- Left Side (RTL End): App & Role Switcher + Nav History (انتهای سمت چپ) -->
      <div class="flex items-center gap-2 flex-1 min-w-0 justify-end">
        <!-- سوئیچر دولایه ماژول کلان و نقش فعال -->
        <app-role-switcher class="shrink-0" />

        <!-- ─── History Navigation Segmented Pill (انتهای سمت چپ) ─── -->
        <div class="hidden sm:flex items-center bg-slate-100/90 hover:bg-slate-200/60 p-0.5 rounded-xl border border-slate-200/90 shadow-xs transition-all shrink-0 select-none" dir="rtl">
          <!-- Back Button (صفحه قبل) -->
          <button
            type="button"
            (click)="navHistory.back()"
            [disabled]="!navHistory.canGoBack()"
            class="p-1.5 rounded-lg text-slate-600 hover:text-cyan-600 hover:bg-white active:scale-90 disabled:opacity-30 disabled:hover:bg-transparent disabled:hover:text-slate-400 disabled:cursor-not-allowed disabled:active:scale-100 transition-all flex items-center justify-center cursor-pointer shadow-xs disabled:shadow-none"
            title="صفحه قبل (Alt + راست)"
            aria-label="صفحه قبل">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" appIcon="action-back"></svg>
          </button>

          <!-- Subtle Divider -->
          <div class="w-px h-3.5 bg-slate-300/70 mx-0.5"></div>

          <!-- Forward Button (صفحه بعد) -->
          <button
            type="button"
            (click)="navHistory.forward()"
            [disabled]="!navHistory.canGoForward()"
            class="p-1.5 rounded-lg text-slate-600 hover:text-cyan-600 hover:bg-white active:scale-90 disabled:opacity-30 disabled:hover:bg-transparent disabled:hover:text-slate-400 disabled:cursor-not-allowed disabled:active:scale-100 transition-all flex items-center justify-center cursor-pointer shadow-xs disabled:shadow-none"
            title="صفحه بعد (Alt + چپ)"
            aria-label="صفحه بعد">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" appIcon="action-forward"></svg>
          </button>
        </div>
      </div>
    </header>

    <!-- ناحیه اصلی نمایش صفحات (Router Outlet Workspace) -->
    <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8 bg-slate-50 text-slate-800">
      <router-outlet></router-outlet>
    </main>

  </div>

  <!-- دراور منوی موبایل -->
  <div
    *ngIf="isMobileMenuOpen()"
    class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs lg:hidden"
    (click)="closeMobileMenu()"
  >
    <div
      class="w-72 h-full bg-slate-900 border-l border-slate-800 p-4 flex flex-col justify-between overflow-y-auto"
      (click)="$event.stopPropagation()"
    >
      <div class="flex-1 flex flex-col min-h-0">
        <div class="flex items-center justify-between pb-4 mb-4 border-b border-slate-800 shrink-0">
          <span class="text-sm font-black text-white">منوی مرکز عملیات</span>
          <button (click)="closeMobileMenu()" class="min-w-[40px] min-h-[40px] flex items-center justify-center text-slate-400 hover:text-white cursor-pointer tap-target" title="بستن منو" aria-label="بستن منو">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" appIcon="action-close"></svg>
          </button>
        </div>
        <div class="flex flex-col gap-1 overflow-y-auto flex-1">
          <button
            *ngFor="let item of navItems"
            (click)="navigateTo(item.route)"
            class="flex items-center gap-3 px-3 py-2.5 min-h-[40px] rounded-xl text-xs font-bold text-right cursor-pointer"
            [ngClass]="activeRoute() === item.id ? 'bg-indigo-600 text-white' : 'text-slate-300 hover:bg-slate-800'"
            [title]="item.label"
          >
            <span class="shrink-0 flex items-center justify-center">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" [appIcon]="item.icon"></svg>
            </span>
            <span>{{ item.label }}</span>
          </button>
        </div>
      </div>

      <div *ngIf="hasAnyConnectedModule" class="flex flex-col gap-2 pt-4 border-t border-slate-800 shrink-0">
        <button *ngIf="showWarehouseLink" (click)="goToWarehouse()" class="w-full py-2.5 min-h-[40px] rounded-xl bg-slate-800 text-indigo-300 text-xs font-bold cursor-pointer">ورود به انبارداری</button>
        <button *ngIf="showAccountingLink" (click)="goToFinance()" class="w-full py-2.5 min-h-[40px] rounded-xl bg-slate-800 text-emerald-300 text-xs font-bold cursor-pointer">ورود به سامانه مالی</button>
      </div>
    </div>
  </div>

  <!-- دراور پیام‌رسان سازمانی -->
  <app-chat-drawer *ngIf="commService.isChatDrawerOpen()" />

  <!-- ویزارد راه‌اندازی اول در زمان دیتابیس خام یا عدم ثبت شرکت -->
  <app-first-boot-wizard></app-first-boot-wizard>

  <!-- مودال هوشمند انتخاب شرکت کاری هنگام ورود یا تغییر -->
  <app-company-selection-modal></app-company-selection-modal>
</div>
