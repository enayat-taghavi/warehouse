      <div  class="fade-in">
        <div class="bg-white rounded-3xl border border-slate-200 overflow-hidden shadow-sm">
          <div class="bg-slate-50 border-b border-slate-200 p-5">
            <h4 class="font-black text-slate-800 text-[13px] flex items-center gap-2">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4f46e5" stroke-width="2.5" appIcon="action-print"></svg>
              طراح لیبل (Global)
            </h4>
          </div>
          <div class="p-6">
            @if (!hasLabelDesigner) {
              <div class="flex flex-col items-center gap-2 p-6 text-center text-fg-muted">
                <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" appIcon="info"></svg>
                <p class="text-[12px] font-bold">طراح لیبل فقط در ماژول انبارداری فعال است.</p>
              </div>
            } @else if (loadFailed()) {
              <div class="flex flex-col items-center gap-3 p-6 text-center text-fg-muted" role="alert">
                <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" appIcon="alert-triangle"></svg>
                <p class="text-[12px] font-bold">بارگذاری طراح لیبل انجام نشد؛ اتصال را بررسی کنید و دوباره تلاش کنید.</p>
                <button type="button" appAction="refresh" (click)="loadDesigner()"></button>
              </div>
            } @else if (labelDesignerComponent()) {
              <ng-container *ngComponentOutlet="labelDesignerComponent(); inputs: { warehouseId: null }"></ng-container>
            } @else {
              <app-loading-skeleton type="card" [count]="1" />
            }
          </div>
        </div>
      </div>
