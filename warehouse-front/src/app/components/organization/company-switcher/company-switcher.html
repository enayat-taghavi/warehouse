<div class="relative shrink-0 select-none" dir="rtl">
  <!-- Trigger Button -->
  <button 
    type="button" 
    (click)="toggleDropdown($event)"
    [title]="isMultiCompanyUser ? (companyService.activeCompany ? 'شرکت کاری فعال: ' + companyService.activeCompany.name + ' (کلیک برای تغییر)' : 'انتخاب شرکت کاری') : (companyService.activeCompany ? 'شرکت کاری: ' + companyService.activeCompany.name : 'شرکت کاری')"
    class="flex items-center gap-1.5 sm:gap-2 p-1.5 sm:px-3 sm:py-1.5 rounded-xl border transition-all shadow-xs group cursor-pointer active:scale-95"
    [ngClass]="companyService.activeCompany ? 'bg-indigo-50/70 hover:bg-indigo-100/70 border-indigo-200/90 text-indigo-950' : 'bg-slate-100 hover:bg-slate-200/80 border-slate-300 text-slate-700'">
    
    <div class="w-6 h-6 rounded-lg font-black text-xs flex items-center justify-center shrink-0 shadow-2xs relative"
         [ngClass]="companyService.activeCompany ? 'bg-indigo-600 text-white' : 'bg-slate-300 text-slate-700'">
      🏢
      <!-- Status dot on mobile right over the icon -->
      <span class="sm:hidden absolute -top-0.5 -right-0.5 w-2 h-2 rounded-full border border-white"
            [ngClass]="companyService.activeCompany ? 'bg-emerald-500' : 'bg-amber-400'"></span>
    </div>

    <!-- Desktop & Tablet View -->
    <div class="hidden sm:flex flex-col text-right min-w-0 sm:max-w-[140px] md:max-w-[190px]">
      <div class="flex items-center gap-1">
        <span class="w-1.5 h-1.5 rounded-full" [ngClass]="companyService.activeCompany ? 'bg-emerald-500 animate-pulse' : 'bg-amber-400'"></span>
        <span class="text-[9px] text-slate-500 font-bold leading-tight">شرکت کاری</span>
        <span *ngIf="companyService.activeCompany?.code" class="text-[8px] font-mono font-bold bg-white/80 px-1 py-0.2 rounded text-indigo-600 border border-indigo-100">
          {{ companyService.activeCompany?.code }}
        </span>
      </div>
      <span class="text-xs font-black truncate leading-tight group-hover:text-indigo-700 transition-colors">
        {{ companyService.activeCompany ? companyService.activeCompany.name : 'انتخاب نشده' }}
      </span>
    </div>

    <!-- Chevron arrow: Only shown on desktop & tablet for multi-company / superuser -->
    <svg *ngIf="isMultiCompanyUser" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="hidden sm:inline transition-transform duration-200 shrink-0 text-slate-400 group-hover:text-indigo-600" [class.rotate-180]="isOpen" appIcon="chevron-down"></svg>
  </button>

  <!-- Dropdown Menu -->
  <div 
    *ngIf="isOpen && isMultiCompanyUser" 
    class="absolute right-0 top-full mt-2 w-64 max-w-[calc(100vw-24px)] bg-white rounded-2xl border border-slate-200 shadow-xl py-2 z-50 animate-in fade-in zoom-in-95 duration-150">
    
    <div class="px-3 py-1.5 border-b border-slate-100 text-[11px] font-bold text-slate-400 flex items-center justify-between">
      <span>شرکت‌های مجاز شما</span>
      <span class="text-[10px] bg-slate-100 px-1.5 py-0.5 rounded-md font-mono text-slate-600">
        {{ (companyService.availableCompanies$ | async)?.length || 0 }}
      </span>
    </div>

    <div class="max-h-60 overflow-y-auto py-1 space-y-0.5">
      <button 
        *ngFor="let company of companyService.availableCompanies$ | async"
        type="button"
        (click)="selectCompany(company)"
        [ngClass]="companyService.activeCompany?.id === company.id ? 'bg-indigo-50 text-indigo-700 font-bold' : 'text-slate-700 hover:bg-slate-50'"
        class="w-full flex items-center justify-between px-3 py-2 text-xs transition-colors cursor-pointer text-right">
        <div class="flex items-center gap-2 min-w-0">
          <span class="w-6 h-6 rounded-md bg-slate-100 text-slate-700 font-mono text-[10px] font-bold flex items-center justify-center shrink-0">
            {{ company.code }}
          </span>
          <span class="truncate">{{ company.name }}</span>
        </div>
        <span *ngIf="companyService.activeCompany?.id === company.id" class="text-indigo-600 text-xs">✔</span>
      </button>

      <button 
        *ngIf="companyService.isSuperuser$ | async"
        type="button"
        (click)="selectCompany(null)"
        [ngClass]="!companyService.activeCompany ? 'bg-indigo-50 text-indigo-700 font-bold' : 'text-slate-700 hover:bg-slate-50'"
        class="w-full flex items-center justify-between px-3 py-2 text-xs transition-colors cursor-pointer text-right border-t border-slate-100">
        <div class="flex items-center gap-2">
          <span class="w-6 h-6 rounded-md bg-slate-100 text-slate-700 text-xs flex items-center justify-center shrink-0">🌍</span>
          <span>همه شرکت‌ها (بدون فیلتر)</span>
        </div>
        <span *ngIf="!companyService.activeCompany" class="text-indigo-600 text-xs">✔</span>
      </button>
    </div>

    <div class="pt-1.5 mt-1 border-t border-slate-100 px-2">
      <button 
        type="button"
        (click)="openModal()"
        class="w-full py-1.5 px-2 rounded-xl text-center text-xs font-bold text-indigo-600 hover:bg-indigo-50 transition-colors cursor-pointer flex items-center justify-center gap-1.5">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" appIcon="edit-2"></svg>
        <span>پنجره انتخاب فضای کاری...</span>
      </button>
    </div>

  </div>
</div>
