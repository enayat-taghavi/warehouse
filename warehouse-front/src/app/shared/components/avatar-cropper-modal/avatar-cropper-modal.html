<!-- Backdrop -->
<div class="modal-backdrop" (click)="close()"></div>

<!-- Modal Container -->
<div class="modal-container" dir="rtl">
  <!-- Header -->
  <div class="modal-header">
    <div class="header-title-group">
      <div class="header-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" appIcon="user-circle"></svg>
      </div>
      <div>
        <h2>{{ title }}</h2>
        <span class="header-subtitle">برش و بهینه‌سازی استاندارد تصویر پرسنلی</span>
      </div>
    </div>
    <button appAction="close" display="icon" (click)="close()"></button>
  </div>

  <!-- Body -->
  <div class="modal-body">
    <!-- Top Action Toolbar -->
    <div class="toolbar-section">
      <div class="source-buttons flex-wrap sm:flex-nowrap gap-2">
        <button type="button" class="tool-btn primary min-h-[40px] tap-target cursor-pointer" (click)="fileInput.click()" title="انتخاب فایل عکس" aria-label="انتخاب فایل عکس">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" appIcon="action-upload"></svg>
          <span>انتخاب فایل عکس</span>
        </button>
        <input #fileInput type="file" accept="image/png,image/jpeg,image/webp,image/gif" (change)="onFileSelected($event)" style="display: none" />

        <button *ngIf="cameraAvailable" appAction="camera" (click)="startCamera()" label="ثبت با دوربین / وب‌کم"></button>
      </div>
    </div>

    <!-- Main Viewport Area -->
    <div class="viewport-wrapper">
      <!-- Mode: Camera -->
      <div *ngIf="activeMode === 'camera'" class="camera-container">
        <video #cameraVideo autoplay playsinline muted class="camera-video"></video>
        
        <div class="camera-overlay">
          <div class="camera-target-box ratio-1-1"></div>
        </div>

        <div *ngIf="cameraError" class="camera-error-banner">
          ⚠️ {{ cameraError }}
        </div>

        <div class="camera-controls">
          <button type="button" class="cam-btn cancel min-h-[44px] cursor-pointer" (click)="cancelCamera()" title="انصراف" aria-label="انصراف">انصراف</button>
          <button type="button" class="cam-btn snap min-h-[44px] cursor-pointer" (click)="captureFromCamera()" [disabled]="!isCameraReady" title="ثبت عکس">
            <div class="shutter-circle"></div>
            <span>{{ isCameraReady ? 'ثبت عکس' : 'در حال آماده‌سازی...' }}</span>
          </button>
        </div>
      </div>

      <!-- Mode: Crop Canvas -->
      <div *ngIf="activeMode === 'crop'" class="canvas-container" (drop)="onDrop($event)" (dragover)="onDragOver($event)">
        <!-- Placeholder if no image is loaded yet -->
        <div *ngIf="!imageLoaded" class="empty-dropzone" (click)="fileInput.click()">
          <div class="drop-icon">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" appIcon="action-camera"></svg>
          </div>
          <p class="drop-main-text">تصویر پرسنلی را اینجا رها کنید</p>
          <p class="drop-sub-text">یا بر روی «انتخاب فایل عکس» کلیک نمایید</p>
          <span class="drop-pill">JPG, PNG, WebP</span>
        </div>

        <!-- Canvas Active Viewport with Touch & Mouse Gestures -->
        <div
          *ngIf="imageLoaded"
          class="canvas-box ratio-1-1"
          (touchstart)="onTouchStart($event)"
          (touchmove)="onTouchMove($event)"
          (touchend)="onTouchEnd($event)"
          (pointerdown)="onPointerDown($event)"
          (pointermove)="onPointerMove($event)"
          (pointerup)="onPointerUp($event)"
          (wheel)="onWheel($event)"
        >
          <!-- Floating Rotate Button in Top Right Corner -->
          <button
            type="button"
            class="floating-rotate-btn min-w-[40px] min-h-[40px] flex items-center justify-center cursor-pointer tap-target"
            (click)="rotateRight(); $event.stopPropagation()"
            (pointerdown)="$event.stopPropagation()"
            (touchstart)="$event.stopPropagation()"
            title="چرخش ۹۰ درجه تصویر"
            aria-label="چرخش ۹۰ درجه تصویر"
          >
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" appIcon="action-refresh"></svg>
          </button>

          <canvas
            #cropCanvas
            [width]="320"
            [height]="320"
            class="crop-canvas"
          ></canvas>

          <!-- Mask Guide Overlay -->
          <div class="crop-mask-overlay mask-circle"></div>
        </div>

        <p *ngIf="imageLoaded" class="canvas-hint">
          💡 جابه‌جایی با کشیدن ماوس/دست • بزرگ‌نمایی با اسکرول ماوس یا زوم دو انگشتی
        </p>
      </div>
    </div>
  </div>

  <!-- Footer Actions -->
  <div class="modal-footer flex-col sm:flex-row gap-2">
    <div class="footer-left w-full sm:w-auto">
      <button *ngIf="currentAvatarUrl"
              appAction="delete"
              tone="rose"
              size="md"
              display="label"
              label="حذف عکس فعلی"
              (click)="removeAvatar()"
              [disabled]="isSaving"
              class="w-full sm:w-auto">
      </button>
    </div>

    <div class="footer-right w-full sm:w-auto flex-col sm:flex-row gap-2">
      <button appAction="close"
              size="lg"
              display="label"
              label="انصراف"
              (click)="close()"
              [disabled]="isSaving"
              class="w-full sm:w-auto">
      </button>
      <button appAction="save"
              size="lg"
              display="label"
              label="ذخیره و اعمال تصویر"
              [disabled]="!imageLoaded || isSaving"
              [busy]="isSaving"
              (click)="saveCroppedImage()"
              class="w-full sm:w-auto">
      </button>
    </div>
  </div>
</div>
