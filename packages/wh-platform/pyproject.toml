[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wh-platform"
version = "1.0.0"
description = "هستهٔ مشترک سامانه انبارگردانی و حسابداری: هویت، RBAC، ممیزی، SoD، تنظیمات، چت و رجیستری قابلیت‌ها"
requires-python = ">=3.12"
dependencies = [
    "Django==5.0.4",
    "djangorestframework==3.15.1",
    "djangorestframework-simplejwt==5.3.1",
    "django-cors-headers==4.3.1",
    "psycopg2-binary==2.9.9",
    "channels==4.0.0",
    "channels-redis==4.2.0",
    "daphne==4.1.0",
    "django-filter==24.2",
    "django-axes==8.3.1",
    "openpyxl==3.1.5",
    "cryptography>=43.0.0",
    "packaging>=24.0",
]
classifiers = [
    "Private :: Do Not Upload",
]

[tool.setuptools]
package-dir = { "" = "../../backend/core" }

[tool.setuptools.packages.find]
where = ["../../backend/core"]
include = [
    "accounts*",
    "common*",
    "communications*",
    "config*",
    "notifications*",
    "settings_core*",
    "platform_core*",
    "companies*",
    "reports*",
]
